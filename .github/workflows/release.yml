name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: webui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          bash -n install.sh
          mkdir -p dist
          package="aiagent-ssh-proxy-linux-amd64"
          package_dir="dist/${package}"
          mkdir -p "${package_dir}/systemd"
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${package_dir}/aiagent-ssh-proxy" .
          cp install.sh "${package_dir}/install.sh"
          cp README.md "${package_dir}/README.md"
          mkdir -p "${package_dir}/docs"
          cp docs/20260911-windows-agent.md "${package_dir}/docs/20260911-windows-agent.md"
          cp systemd/aiagent-ssh-proxy.service "${package_dir}/systemd/aiagent-ssh-proxy.service"
          chmod 0755 "${package_dir}/aiagent-ssh-proxy" "${package_dir}/install.sh"
          tar czf "dist/${package}.tar.gz" -C dist "${package}"
          rm -rf "${package_dir}"

      - name: Build Windows Agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/aiagent-ssh-client-windows-amd64
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/aiagent-ssh-client-windows-amd64/aiagent-ssh-client.exe ./cmd/windows-agent
          cp README.md dist/aiagent-ssh-client-windows-amd64/README.md
          mkdir -p dist/aiagent-ssh-client-windows-amd64/docs
          cp docs/20260911-windows-agent.md dist/aiagent-ssh-client-windows-amd64/docs/20260911-windows-agent.md
          cd dist
          zip -r aiagent-ssh-client-windows-amd64.zip aiagent-ssh-client-windows-amd64
          sha256sum aiagent-ssh-client-windows-amd64.zip > aiagent-ssh-client-windows-amd64.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
