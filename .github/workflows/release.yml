name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: webui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          bash -n install.sh
          mkdir -p dist
          package="claude-ssh-proxy-linux-amd64"
          package_dir="dist/${package}"
          mkdir -p "${package_dir}/systemd"
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${package_dir}/claude-ssh-proxy" .
          cp install.sh "${package_dir}/install.sh"
          cp README.md "${package_dir}/README.md"
          cp systemd/claude-ssh-proxy.service "${package_dir}/systemd/claude-ssh-proxy.service"
          chmod 0755 "${package_dir}/claude-ssh-proxy" "${package_dir}/install.sh"
          tar czf "dist/${package}.tar.gz" -C dist "${package}"
          rm -rf "${package_dir}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
